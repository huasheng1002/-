# 密码表与优先级示例
#
# 解析规则：
#   1. 路径规范化后与 files 的键精确匹配（Windows 大小写不敏感）；
#   2. 命中则按该列表顺序逐个尝试，序号从 1 开始；
#   3. 未命中则使用 default 列表顺序；
#   4. 全部失败记录“密码未命中”并跳过该文件。

files:
  "D:/input/a.zip":
    - "pwd_a_1"      # 优先级 1
    - "pwd_a_2"      # 优先级 2
  "D:/input/sub/b.7z":
    - "pwd_b_1"

# 未精确匹配时使用默认候选，按顺序尝试
default:
  - "常用密码1"
  - "常用密码2"
